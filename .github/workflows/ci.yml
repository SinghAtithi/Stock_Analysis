# NIFTY//CI — repo gate (TASK-29).
# Mirrors scripts/workflow.mjs verify: tsc --noEmit → eslint → node:test.
# Precedent: ADR-0001 fixes GitHub Actions as the first-class runner for this
# repo's compute (curl availability, cron ingest); this workflow extends that
# to PR gating. Red build = do not merge (by team convention; branch
# protection is enabled repo-side when admin access allows).
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 */6 * * *" # self-test every 6h — catches dep drift + flake between pushes
  workflow_dispatch: {} # manual one-shot test

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6 # AC: full runtime under 5min; headroom for cold caches
    permissions:
      contents: write # TASK-1479: auto-file/auto-close CI RED board cards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc # 24.x — matches engines pin
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: deps (web)
        working-directory: web
        run: npm ci

      # next-env.d.ts imports .next/types/* (LayoutProps & friends) — generate
      # them before tsc; a fresh checkout has no dev-build artifacts
      - name: next typegen
        working-directory: web
        run: npx next typegen

      - name: tsc --noEmit
        working-directory: web
        run: npx tsc --noEmit

      - name: eslint
        working-directory: web
        run: npm run lint

      # TASK-1518 / UNSLOPIFY.md §2 rule 1: no unsanctioned hex/rgb color
      # literals in web/src — the palette lives in globals.css tokens only.
      - name: ui tokens (palette discipline)
        run: node scripts/check-ui-tokens.mjs

      # includes parser suites and the eod-cliff-sweep guard (self-skips when
      # db/data/app.db is absent — it is gitignored, so CI exercises pure code)
      - name: node:test
        working-directory: web
        run: npm test

  # TASK-1374: dependency + secrets hygiene, blocking like the gates above.
  # npm audit: prod deps only (--omit=dev matches the local gate); high+ fails.
  # gitleaks: full-history scan so a secret that ever lands is caught even if
  # a later commit removed it. Pinned to v2 tag per repo convention (SHA
  # pinning tracked separately in TASK-1478).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # TASK-1479: sync pushes data/board.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit (prod deps, fail on high+)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: gitleaks (full history)
        # direct binary — gitleaks-action v2.3.x requires a GITLEAKS_LICENSE
        # secret this repo doesn't carry; the CLI has no such gate
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact -v

      # TASK-1479: red runs file (or update) a `CI RED: ci` board card; 3
      # consecutive greens auto-close it. Only pushes data/board.json.
      - name: sync result to board
        if: always() && github.event_name != 'pull_request'
        env:
          SUITE_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          # job.status is GitHub's vocabulary (success/failure/cancelled);
          # ci-board-sync expects red|green — cancelled/skipped is a no-op
          case "$SUITE_STATUS" in
            success) SYNC=green ;;
            failure) SYNC=red ;;
            cancelled|canceled|skipped) echo "suite $SUITE_STATUS — no board update"; exit 0 ;;
            green|red) SYNC="$SUITE_STATUS" ;;
            *) echo "unknown SUITE_STATUS: $SUITE_STATUS" >&2; exit 1 ;;
          esac
          node scripts/ci-board-sync.mjs --status "$SYNC" \
            --suite ci --run-url "$RUN_URL" --sha "$SHA"
          if ! git diff --quiet data/board.json; then
            git config user.name "niftyterm-ci"
            git config user.email "ci@users.noreply.github.com"
            git add data/board.json
            git commit -m "chore(board): ci status sync — ci ${SUITE_STATUS} ${GITHUB_SHA::7}"
            git pull --rebase -q origin master || true
            git push
          fi
