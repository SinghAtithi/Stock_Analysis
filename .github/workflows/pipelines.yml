# NIFTY//PIPELINES — scheduled data pipelines (TASK-47, per ADR-0001).
#
# Cadences (IST = UTC+5:30):
#   eod-ingest        13:30 UTC Mon–Fri (19:00 IST) — post-close daily top-up
#   signals           chained after eod-ingest via `needs` (fresh candles)
#   db-backup         chained after signals — consistent snapshot + board.json,
#                     14-day artifact retention (TASK-1389)
#   breadth-morning    02:30 UTC daily (08:00 IST) — FII/DII + prior-day breadth
#
# Runtime budget (documented per AC):
#   eod-ingest   timeout 50min — ingest proper is ~3min warm (~8min observed
#                Sep 2026 under throttle) + fill-universe toward nifty500 is
#                hard-bounded at --budget-min 25 (measured 27min incl.
#                overhead 2026-09-22); 40min left only ~4.5min headroom.
#   signals      timeout 30min — nifty500 fundamentals + analyst ingest,
#                snapshots, alerts (~15min+ observed Sep 2026; the old
#                ~2–3min figure predates the TASK-57 factor ingest).
#   breadth      timeout 10min — VIX/FII-DII/breadth collection (~1–2min).
#
# Fresh-checkout safe: db/data/ is gitignored, ingest runs migrations on an
# empty DB; suites invoked here self-skip without data. The DB itself rides
# actions/cache so nightly runs are incremental, not full re-pulls.
#
# Failure notification: any failed job opens (or appends to) an issue via gh.

name: pipelines

on:
  schedule:
    - cron: "30 13 * * 1-5" # eod-ingest — 19:00 IST Mon–Fri
    - cron: "30 2 * * *"    # breadth-morning — 08:00 IST daily
  workflow_dispatch: {}     # manual run for testing/debugging

permissions:
  contents: read
  issues: write

concurrency:
  group: pipelines-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  eod-ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: restore candle store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: db/data
          key: eod-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: eod-db-${{ runner.os }}-

      - name: eod ingest (nifty50, incremental)
        run: node --experimental-strip-types scripts/ingest-eod.mjs --universe nifty50

      # TASK-57 AC1: converge eod_candles toward nifty500 — bounded per night,
      # NSE raw-basis path owns new symbols exclusively (no basis mixing)
      - name: fill universe toward nifty500
        run: node scripts/fill-universe.mjs --universe nifty500 --max 20 --budget-min 25

      - name: report failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/tests/.fail-issue.sh "eod-ingest" "${{ github.run_id }}"

  signals:
    needs: eod-ingest
    # runs after a successful nightly ingest, or unconditionally on manual
    # dispatch; silently skips on the morning-breadth cadence
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '30 13 * * 1-5' && needs.eod-ingest.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: restore candle store (written by eod-ingest's cache save)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: db/data
          key: eod-db-${{ runner.os }}-signals-${{ github.run_id }}
          restore-keys: eod-db-${{ runner.os }}-

      # TASK-57: factor tables feed S104/S105/S081/quality/value. Yahoo
      # quoteSummary is often IP-blocked locally; GH runners get clean IPs.
      - name: ingest-fundamentals (nifty500)
        run: node --experimental-strip-types scripts/ingest-fundamentals.mjs --universe nifty500

      - name: ingest-analyst (nifty500)
        run: node --experimental-strip-types scripts/ingest-analyst.mjs --universe nifty500

      - name: signal snapshots (all strategies)
        run: node --experimental-strip-types scripts/run-signals.mjs --backfill-months 1

      - name: evaluate membership alerts
        run: node --experimental-strip-types scripts/run-alerts.mjs

      # persist refreshed tables for tomorrow's restore-prefix; keep a
      # short-lived artifact so humans can verify row counts without shell access
      - name: save candle + factor store
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: db/data
          key: eod-db-${{ runner.os }}-signals-${{ github.run_id }}

      - name: upload db snapshot for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-db
          path: db/data/app.db
          retention-days: 3
          if-no-files-found: ignore

      - name: report failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: ./scripts/tests/.fail-issue.sh "signals" "$RUN_ID"

  db-backup:
    # TASK-1389: nightly consistent snapshot (VACUUM INTO — WAL-safe, integrity
    # checked) of the freshly-ingested store + board.json, retained 14 days.
    needs: signals
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '30 13 * * 1-5' && needs.signals.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: restore candle store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: db/data
          key: eod-db-${{ runner.os }}-signals-${{ github.run_id }}
          restore-keys: eod-db-${{ runner.os }}-

      - name: snapshot database + board state
        run: node scripts/backup-db.mjs --if-present

      - name: upload backups (14-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-backups
          path: backups/
          retention-days: 14
          if-no-files-found: ignore

      - name: report failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: ./scripts/tests/.fail-issue.sh "db-backup" "$RUN_ID"

  breadth-morning:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: restore candle store (A/D counts read eod_candles)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: db/data
          key: eod-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: eod-db-${{ runner.os }}-

      - name: breadth ingest (last 5 days)
        run: node --experimental-strip-types scripts/ingest-breadth.mjs --days 5

      - name: report failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/tests/.fail-issue.sh "breadth" "${{ github.run_id }}"
