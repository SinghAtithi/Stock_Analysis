# NIFTY//CI — UI smoke (TASK-41).
# Runs the scripts/tests/ui Playwright harness against a production build
# (`next build` + `next start`), so the checks gate on the shipped artifact,
# not a dev server. Two tiers:
#   blocking — mocked / deterministic scripts (route-intercepted data, layout,
#              a11y): chart_mock, tape_mock, screener, mob2, foot, axe ×3.
#              screener route-mocks its APIs (TASK-43) so it gates, not flakes.
#   advisory — live-data scripts (e2e, deeplink hit upstream APIs
#              through the app's fallback chain): failures are logged as
#              warnings and do not fail the job. They graduate to blocking as
#              they prove stable (TASK-17's --e2e attestation expects this
#              suite to exist; hardening it is incremental by design).
# Precedent: ADR-0001 GitHub-Actions-first; mirrors ci.yml conventions.
name: ui-smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 4 * * *" # nightly self-test 09:30 IST — off-peak vs pipelines (02:30/13:30 UTC)
  workflow_dispatch: {} # manual one-shot test

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # build ~2m, browser install ~2m, suite ~4m, headroom
    permissions:
      contents: write # TASK-1479: auto-file/auto-close CI RED board cards
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: deps (web)
        working-directory: web
        run: npm ci

      - name: build (prod artifact under test)
        working-directory: web
        run: npm run build

      - name: start :3000
        working-directory: web
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/ || { echo "server did not come up"; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: deps (python playwright)
        run: |
          pip install "playwright==1.62.0"
          playwright install --with-deps chromium

      - name: blocking suite (mocked + deterministic)
        run: |
          set -u
          fail=0
          for f in chart_mock tape_mock mob2 foot screener axe axe_screener axe_breadth alert_badge; do
            echo "::group::$f"
            timeout 120 python3 "scripts/tests/ui/$f.py" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: advisory suite (live-data; non-blocking)
        continue-on-error: true
        run: |
          for f in e2e deeplink; do
            echo "::group::$f"
            timeout 240 python3 "scripts/tests/ui/$f.py" \
              || echo "::warning::advisory script $f failed (live-data flake or regression — inspect log)"
            echo "::endgroup::"
          done

      - name: stop server
        if: always()
        run: pkill -f "next start" || true

      # TASK-1479: red runs file (or update) a `CI RED: ui-smoke` board card;
      # 3 consecutive greens auto-close it. Only pushes data/board.json.
      - name: sync result to board
        if: always() && github.event_name != 'pull_request'
        env:
          SUITE_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          # job.status is GitHub's vocabulary (success/failure/cancelled);
          # ci-board-sync expects red|green — cancelled/skipped is a no-op
          case "$SUITE_STATUS" in
            success) SYNC=green ;;
            failure) SYNC=red ;;
            cancelled|canceled|skipped) echo "suite $SUITE_STATUS — no board update"; exit 0 ;;
            green|red) SYNC="$SUITE_STATUS" ;;
            *) echo "unknown SUITE_STATUS: $SUITE_STATUS" >&2; exit 1 ;;
          esac
          node scripts/ci-board-sync.mjs --status "$SYNC" \
            --suite ui-smoke --run-url "$RUN_URL" --sha "$SHA"
          if ! git diff --quiet data/board.json; then
            git config user.name "niftyterm-ci"
            git config user.email "ci@users.noreply.github.com"
            git add data/board.json
            git commit -m "chore(board): ci status sync — ui-smoke ${SUITE_STATUS} ${GITHUB_SHA::7}"
            git pull --rebase -q origin master || true
            git push
          fi
